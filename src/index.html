<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' aurora: data: blob:; script-src 'self' aurora: 'unsafe-inline'; style-src 'self' aurora: 'unsafe-inline'; img-src 'self' aurora: data: blob:; media-src 'self' aurora: data: blob:; font-src 'self' aurora: data:; connect-src 'self' aurora: data: blob:;" />
  <title>Aurora 极光音乐</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="density-cozy">
  <div id="bg-anim"></div>
  <div id="bg-layer"></div>
  <div id="bg-dim"></div>

  <div id="app">
    <header class="titlebar">
      <div class="brand"><span class="logo">♪</span><span>Aurora 极光音乐</span></div>
      <div class="search">
        <span class="ico">🔍</span>
        <input id="search" type="text" placeholder="搜索歌曲 / 歌手 / 专辑 / 格式…（Ctrl+F）" autocomplete="off" spellcheck="false" />
        <span class="clear hidden" id="searchClear">✕</span>
      </div>
      <div class="spacer"></div>
      <button class="btn icon ghost tooltip" id="btnSubtitle" data-tip="字幕放映模式 (Ctrl+空格)">🎬</button>
      <button class="btn icon ghost tooltip" id="btnDesktopLyrics" data-tip="桌面歌词 (Ctrl+L)">🖥️</button>
      <div class="win-controls">
        <button id="winMin" class="tooltip" data-tip="最小化">─</button>
        <button id="winMax" class="tooltip" data-tip="最大化">☐</button>
        <button id="winClose" class="close tooltip" data-tip="关闭">✕</button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar panel">
        <div class="nav-item" data-view="now"><span class="ic">🎧</span><span>正在播放</span></div>
        <div class="nav-item" data-view="subtitle"><span class="ic">🎬</span><span>字幕放映</span></div>
        <div class="nav-item active" data-view="library"><span class="ic">🎵</span><span>全部音乐</span><span class="count" id="cntAll">0</span></div>
        <div class="nav-item" data-view="favorites"><span class="ic">❤️</span><span>我的收藏</span><span class="count" id="cntFav">0</span></div>
        <div class="nav-item" data-view="recent"><span class="ic">🕘</span><span>最近播放</span></div>
        <div class="nav-item" data-view="online"><span class="ic">🌐</span><span>在线音乐</span></div>
        <div class="nav-item" data-view="playlists"><span class="ic">📚</span><span>播放列表</span><span class="count" id="cntPl">0</span></div>
        <div class="nav-item" data-view="stats"><span class="ic">📊</span><span>听歌统计</span></div>
        <div class="nav-item" data-view="eq"><span class="ic">🎚️</span><span>均衡器</span></div>
        <div class="nav-item" data-view="plugins"><span class="ic">✨</span><span>音效插件</span></div>
        <div class="nav-item" data-view="settings"><span class="ic">⚙️</span><span>设置</span></div>

        <div class="side-title">音乐文件夹</div>
        <div id="rootsList"></div>
        <div class="btn sm" id="addFolder" style="margin:6px 8px 0">＋ 添加文件夹</div>

        <div class="side-title">播放列表</div>
        <div id="playlistNav"></div>
        <div class="btn sm" id="newPlaylist" style="margin:6px 8px 0">＋ 新建播放列表</div>
      </aside>

      <main class="view panel" id="viewRoot"></main>
    </div>

    <footer class="player panel">
      <div class="np">
        <div class="cover ph" id="npCover">♪</div>
        <div class="meta grow">
          <div class="title" id="npTitle">未播放</div>
          <div class="artist" id="npArtist">选择一首歌开始</div>
          <div class="row" style="margin-top:5px;gap:6px">
            <span class="badge" id="npFormat">—</span>
            <span class="badge" id="npPlayed">已听 00:00</span>
          </div>
        </div>
        <button class="btn icon ghost tooltip" id="btnFav" data-tip="收藏 (Ctrl+D)">♡</button>
      </div>

      <div class="mid">
        <div class="controls">
          <button class="btn icon ghost tooltip" id="btnShuffle" data-tip="随机播放 (Ctrl+S)">🔀</button>
          <button class="btn icon ghost tooltip" id="btnPrev" data-tip="上一首 (Ctrl+←)">⏮</button>
          <button class="btn icon play-btn tooltip" id="btnPlay" data-tip="播放 / 暂停 (空格)">▶</button>
          <button class="btn icon ghost tooltip" id="btnNext" data-tip="下一首 (Ctrl+→)">⏭</button>
          <button class="btn icon ghost tooltip" id="btnRepeat" data-tip="循环模式 (Ctrl+R)">🔁</button>
          <div class="sep" style="width:1px;height:22px;background:var(--border);margin:0 4px"></div>
          <button class="btn icon ghost tooltip" id="btnRate" data-tip="速度 / 变调">1.0×</button>
          <button class="btn icon ghost tooltip" id="btnTransition" data-tip="切歌过渡效果">🌀</button>
        </div>
        <div class="progress-line">
          <span class="time" id="tCur">00:00</span>
          <div class="pbar" id="pbar">
            <div class="track"><div class="buffered" id="pBuffered"></div><div class="fill" id="pFill"></div></div>
            <div class="knob" id="pKnob"></div>
          </div>
          <span class="time" id="tDur">00:00</span>
        </div>
      </div>

      <div class="right">
        <div class="mini-eq" id="miniEq" title="频谱"></div>
        <button class="btn icon ghost tooltip" id="btnEqQuick" data-tip="均衡器 (Ctrl+E)">🎚️</button>
        <button class="btn icon ghost tooltip" id="btnPluginQuick" data-tip="音效插件">✨</button>
        <button class="btn icon ghost tooltip" id="btnMini" data-tip="迷你播放器 (Ctrl+P)">🪟</button>
        <button class="btn icon ghost tooltip" id="btnVisualizer" data-tip="音频浮动板块">📈</button>
        <div class="sep" style="width:1px;height:22px;background:var(--border);margin:0 4px"></div>
        <div class="vol-wrap">
          <button class="btn icon ghost tooltip" id="btnMute" data-tip="静音 (Ctrl+M)">🔊</button>
          <input type="range" id="volume" min="0" max="100" value="80" />
        </div>
      </div>
    </footer>
  </div>

  <div class="float-panel hidden" id="floatPanel">
    <div class="fp-head">
      <span>📈 音频浮动板块</span>
      <span class="grow"></span>
      <select id="vizStyle" class="btn sm" style="padding:2px 6px">
        <option value="bars">频谱柱</option>
        <option value="mirror">镜像柱</option>
        <option value="wave">波形</option>
        <option value="radial">环形</option>
        <option value="dots">粒子</option>
      </select>
      <span class="btn icon ghost sm" id="vizClose" style="width:22px;height:22px">✕</span>
    </div>
    <canvas id="vizCanvas"></canvas>
    <div class="fp-info">
      <span class="t" id="vizTitle">未播放</span>
      <span id="vizTime" class="mono">00:00</span>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <div id="modalRoot"></div>

  <script src="js/defaults.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/util.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/player.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/dragsort.js"></script>
  <script src="js/views.js"></script>
  <script src="js/subtitle.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
