<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' aurora: data: blob:; style-src 'self' aurora: 'unsafe-inline'; img-src 'self' aurora: data: blob:;" />
  <title>桌面歌词</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      user-select: none; -webkit-font-smoothing: antialiased;
    }

    /* 可拖动的窗口区域（左侧封面 + 四周留白）；
       歌词区见下面 #lyr 的 no-drag 说明。锁定后整块 no-drag（配合鼠标穿透） */
    #root {
      position: absolute; inset: 0; display: flex; align-items: center;
      gap: 18px; padding: 14px 20px;
      -webkit-app-region: drag;
    }
    #root.locked { -webkit-app-region: no-drag; }

    /* 可选底板 */
    #bg { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
    #bg.on { opacity: 1; }

    /* ---------------- 左侧圆形封面 ----------------
       故意不加 no-drag：歌词区为了右键设置改成了 no-drag，
       封面（和四周留白）就成了拖动窗口的主要把手 */
    #coverWrap { position: relative; flex: none; }
    #cover {
      width: 96px; height: 96px; border-radius: 50%;
      background-color: rgba(255, 255, 255, .07);
      background-size: cover; background-position: center; background-repeat: no-repeat;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: rgba(255, 255, 255, .5);
      border: 2px solid rgba(255, 255, 255, .18);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .5);
      transition: border-radius .25s var(--e, ease), width .25s, height .25s;
    }
    #cover.rounded { border-radius: 22%; }
    #cover.ph { background-image: none !important; }
    /* 播放时缓慢旋转的光环 */
    #coverRing {
      position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; opacity: 0;
      background: conic-gradient(from 0deg, transparent 0deg, var(--accentA, #7c5cff) 90deg, transparent 200deg);
      transition: opacity .5s;
    }
    #coverRing.on { opacity: .75; animation: spin 7s linear infinite; }
    #coverRing.rounded { border-radius: 26%; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 封面随低频脉动：直接改 --pulse，由 JS 每帧写 */
    #cover { transform: scale(var(--pulse, 1)); }

    /* 横向频谱：贴在歌词下方一排。
       之前试过「绕封面一圈的环形频谱」，绕圈的亮度分布天然不均、
       加上柱条径向排布很难调好看，换成横向一排更干净也更好读。 */
    #spec {
      display: flex; align-items: flex-end; gap: 2px;
      height: var(--specH, 26px); margin-top: 8px;
      opacity: 0; transition: opacity .35s;
    }
    #spec.on { opacity: .9; }
    #spec i {
      flex: 1; min-width: 0; height: 2px; border-radius: 2px;
      background: linear-gradient(180deg, var(--accentB, #22d3ee), var(--accentA, #7c5cff));
      will-change: height;
    }

    /* ---------------- 右侧歌词 ----------------
       歌词区必须显式声明 no-drag：在 Windows 上 -webkit-app-region: drag 的区域
       等于窗口标题栏（非客户区），在它上面点右键会弹出系统菜单（还原 / 移动 /
       大小 / 最小化 / 最大化 / 关闭），而我们的 contextmenu 监听根本收不到事件
       —— 于是「右键歌词打开外观面板」永远打不开，只看到那个系统菜单。
       拖动窗口改由封面和四周留白负责（那两块仍然是 drag）。 */
    #lyr {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      justify-content: center; gap: 4px; -webkit-app-region: no-drag;
    }
    .line { white-space: pre-wrap; word-break: break-word; transition: color .2s, opacity .2s; }
    /* 三行的高度都必须固定：#lyr 是垂直居中的，只要「这一句折成一行还是两行」
       「这一句有没有翻译 / 有没有下一句」改变了整块内容的高度，整块文字就会上下蹦
       —— 这就是「歌词一跳一跳」的来源。所以：
         · 当前句固定占两行（短句也占满，文字顶对齐）
         · 翻译 / 下一句各固定占一行，没内容时用 .ghost 隐藏（保留高度），不要 display:none
         · 频谱关掉时反而要 display:none（窗口那边也不再给它留位置） */
    #cur { line-height: 1.26; min-height: 2.52em; }
    #nxt { opacity: .48; min-height: 1.26em; }
    #tr { opacity: .8; min-height: calc(1.26em + 3px); }
    .ghost { visibility: hidden !important; }
    /* 翻译行与正文字号一致（字号由 JS 统一设定，这里只负责排版），
       主次靠透明度区分——以前这里按 .64em 缩过，同一屏两行一大一小。 */
    .tr-text { display: block; font-size: 1em; margin-top: 3px; opacity: .85; }
    #empty { color: #fff; opacity: .62; font-size: 14px; }
    .hidden { display: none !important; }
    #bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px;
      background: rgba(255, 255, 255, .12); opacity: 0; transition: opacity .25s;
    }
    #bar.on { opacity: 1; }
    #bar > i { display: block; height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, var(--accentA, #7c5cff), var(--accentB, #22d3ee)); }

    /* ---------------- 调色板 / 快捷设置面板 ---------------- */
    #panel {
      position: absolute; top: 36px; right: 6px; width: 400px; max-height: calc(100% - 44px); overflow-y: auto;
      background: rgba(16, 17, 25, .95); border: 1px solid rgba(255, 255, 255, .17); border-radius: 14px;
      padding: 12px; color: #eef1ff; font-size: 12px; display: none;
      -webkit-app-region: no-drag; backdrop-filter: blur(18px); box-shadow: 0 20px 54px rgba(0, 0, 0, .65);
      font-family: "Microsoft YaHei UI", sans-serif;
    }
    #panel.open { display: block; }
    .shead { font-weight: 700; margin: 2px 0 9px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
    .shead .grow { flex: 1; }
    .sgroup { border-top: 1px solid rgba(255, 255, 255, .1); margin: 10px 0 8px; padding-top: 9px; opacity: .95; font-weight: 600; font-size: 11.5px; letter-spacing: .4px; }
    .srow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .srow > label { width: 74px; flex: none; opacity: .85; }
    .srow input[type="range"] { flex: 1; -webkit-appearance: none; height: 18px; background: transparent; cursor: pointer; }
    .srow input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 999px; background: rgba(255, 255, 255, .2); }
    .srow input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border-radius: 50%;
      background: #fff; border: 2px solid var(--accentA, #7c5cff);
    }
    .srow input[type="color"] { width: 38px; height: 24px; padding: 1px; border: 1px solid rgba(255, 255, 255, .25); background: transparent; cursor: pointer; border-radius: 6px; }
    .srow select {
      flex: 1; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2);
      color: #fff; border-radius: 7px; padding: 4px 6px; font-size: 12px;
    }
    .srow select option { background: #1e2130; color: #eef1ff; }
    .val { min-width: 44px; text-align: right; opacity: .8; font-variant-numeric: tabular-nums; }
    .sbtn {
      padding: 4px 9px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .08); color: #fff; cursor: pointer; font-size: 11.5px;
    }
    .sbtn:hover { background: rgba(255, 255, 255, .18); }
    .sbtn.wide { flex: 1; text-align: center; }
    .sbtn.primary { background: linear-gradient(135deg, var(--accentA, #7c5cff), var(--accentB, #22d3ee)); border-color: transparent; }
    .stylegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 4px; }
    .stylegrid .sbtn { text-align: center; padding: 6px 4px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .sw { width: 30px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
    .sw:hover { transform: scale(1.08); }
    .sw.sel { border-color: #fff; }
    .hint { opacity: .55; font-size: 11px; line-height: 1.7; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="root">
    <div id="coverWrap">
      <div id="coverRing"></div>
      <div id="cover" class="ph">♪</div>
    </div>
    <div id="lyr">
      <div id="empty">等待播放…</div>
      <div class="line" id="cur"></div>
      <div class="line" id="tr"></div>
      <div class="line" id="nxt"></div>
      <div id="spec"></div>
    </div>
  </div>
  <div id="bar"><i></i></div>
  <div id="panel"></div>
  <script src="js/util.js"></script>
  <script src="js/lyrics-desktop.js"></script>
</body>
</html>
