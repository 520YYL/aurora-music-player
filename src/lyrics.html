<!DOCTYPE html>
<html lang="zh-CN" data-theme="glass">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' aurora: data: blob:; style-src 'self' aurora: 'unsafe-inline'; img-src 'self' aurora: data: blob:;" />
  <title>桌面歌词</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: var(--ly-cn, "Microsoft YaHei UI", sans-serif); user-select: none; -webkit-font-smoothing: antialiased; }
    #root { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;
      padding: 12px 22px; -webkit-app-region: drag; }
    #root.locked { -webkit-app-region: no-drag; }
    .line { transition: all .28s cubic-bezier(.4,0,.2,1); white-space: pre-wrap; word-break: break-word; }
    #cur { line-height: 1.28; }
    #cur .src { display: inline; }
    #nxt { opacity: .55; }
    #tr { opacity: .78; }
    .tr-text { display: block; font-size: .74em; margin-top: 4px; opacity: .82; }
    .hidden { display: none !important; }
    #bar { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; border-radius: 2px; opacity: .9; }
    #tools { position: absolute; top: 6px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .2s;
      -webkit-app-region: no-drag; background: rgba(20,20,30,.55); border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px; padding: 4px; backdrop-filter: blur(10px); }
    body:hover #tools { opacity: 1; }
    #tools button { width: 26px; height: 24px; border: none; border-radius: 7px; background: transparent; color: #fff;
      cursor: pointer; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    #tools button:hover { background: rgba(255,255,255,.18); }
    #tools button.on { background: rgba(124,92,255,.55); }
    #empty { color: #fff; opacity: .75; font-size: 15px; text-align: center; }
    #settings { position: absolute; top: 38px; right: 8px; width: 292px; max-height: 88%; overflow-y: auto;
      background: rgba(18,18,26,.92); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 12px;
      color: #eef1ff; font-size: 12px; display: none; -webkit-app-region: no-drag; backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(0,0,0,.6); font-family: "Microsoft YaHei UI", sans-serif; }
    #settings.open { display: block; }
    .srow { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .srow label { width: 76px; flex: none; opacity: .85; }
    .srow input[type="range"] { flex: 1; }
    .srow input[type="color"] { width: 40px; height: 24px; padding: 1px; border: none; background: transparent; cursor: pointer; }
    .srow select, .srow input[type="text"] { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 7px; padding: 4px 6px; font-size: 12px; }
    .val { min-width: 42px; text-align: right; opacity: .8; font-variant-numeric: tabular-nums; }
    .shead { font-weight: 700; margin: 4px 0 8px; opacity: .95; font-size: 12.5px; }
    .sbtn { padding: 4px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-size: 11.5px; }
    .sbtn:hover { background: rgba(255,255,255,.18); }
    .sbtn.primary { background: linear-gradient(135deg, #7c5cff, #22d3ee); border-color: transparent; }
  </style>
</head>
<body>
  <div id="root">
    <div id="empty">等待播放…</div>
    <div class="line" id="cur"></div>
    <div class="line" id="tr"></div>
    <div class="line" id="nxt"></div>
  </div>
  <div id="bar"></div>
  <div id="tools">
    <button id="btnPrev" title="上一首">⏮</button>
    <button id="btnPlay" title="播放 / 暂停">▶</button>
    <button id="btnNext" title="下一首">⏭</button>
    <button id="btnSettings" title="歌词外观设置">🎨</button>
    <button id="btnLock" title="锁定（鼠标穿透）">🔓</button>
    <button id="btnTop" title="始终置顶">📌</button>
    <button id="btnClose" title="关闭桌面歌词">✕</button>
  </div>
  <div id="settings"></div>
  <script src="js/util.js"></script>
  <script src="js/lyrics-desktop.js"></script>
</body>
</html>
